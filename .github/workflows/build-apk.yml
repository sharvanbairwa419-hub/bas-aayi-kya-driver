name: Build Driver Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_CODE: 6
  VERSION_NAME: 1.3.0

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Patch Android project (permissions + permanent signing)
        run: node scripts/patch-android.mjs

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and SDK levels
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|uses-permission" || true
          mkdir -p out
          cp "$APK" "out/BasAayiKya-Driver-${VERSION_NAME}.apk"
          sha256sum "out/BasAayiKya-Driver-${VERSION_NAME}.apk" | tee out/sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasAayiKya-Driver-APK
          path: out/BasAayiKya-Driver-${{ env.VERSION_NAME }}.apk

      - name: Create GitHub Release with direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.VERSION_NAME }}-apk
          name: "Bas Aayi Kya Driver v${{ env.VERSION_NAME }}"
          allowUpdates: true
          body: |
            ### 🚌 Bas Aayi Kya Driver App — direct download

            **File:** `BasAayiKya-Driver-${{ env.VERSION_NAME }}.apk`
            **Android:** 7.0 (API 24) aur usse upar — 9, 10, 11, 12, 13, 14, 15, 16 sab par install hota hai
            **Signature:** permanent release key (har build par same — update install chalega)

            Install karne se pehle purani app uninstall kar dein (purana build alag key se signed tha).

            - **Login:** owner ka diya 6-character pairing code (koi OTP nahi)
            - **Duty:** bus ka QR scan karke start/end
            - **Server:** Profile me owner ke server ka address ek baar daalein
          files: out/BasAayiKya-Driver-${{ env.VERSION_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
